name: Agent PR automation

# Cierra el ciclo de los PRs generados por agentes contra `main`:
# pide revision a Copilot, aprueba y deja el merge automatico armado.
# El merge real solo ocurre cuando CI pasa, porque `main` exige el check `build`.
#
# Entran dos tipos de PR:
#   - Los que ya traen la etiqueta `ai-generated`, tipicamente de sesiones locales.
#   - Los del agente en la nube (`copilot-swe-agent`), que llegan SIN etiquetas
#     porque no se las puede poner a si mismo. A esos se las ponemos aqui.
#
# Nota: etiquetar con GITHUB_TOKEN no vuelve a disparar este workflow, porque
# GitHub bloquea los eventos originados por ese token para evitar recursion. Por
# eso el autor se detecta en el `if` del job y las etiquetas se aplican dentro,
# en lugar de delegar en un evento `labeled` posterior que nunca llegaria.

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, ready_for_review]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: agent-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  automate:
    name: review and queue merge
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.labels.*.name, 'needs-human') &&
      (contains(github.event.pull_request.labels.*.name, 'ai-generated') ||
       startsWith(github.event.pull_request.user.login, 'copilot-swe-agent'))

    steps:
      # El payload del evento trae las etiquetas congeladas al inicio del run, asi
      # que este paso las relee despues de aplicarlas y publica el veredicto para
      # los pasos siguientes.
      - name: Ensure agent labels
        id: labels
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -e
          if [[ "$AUTHOR" == copilot-swe-agent* ]]; then
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" \
              --add-label ai-generated --add-label auto-merge \
              || echo "Could not add labels; continuing with existing ones"
          fi

          labels=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(",")')
          echo "Labels: $labels"

          if [[ ",$labels," == *",needs-human,"* ]]; then
            echo "automerge=false" >> "$GITHUB_OUTPUT"
            echo "Labelled needs-human: stopping before approval"
          elif [[ ",$labels," == *",auto-merge,"* ]]; then
            echo "automerge=true" >> "$GITHUB_OUTPUT"
          else
            echo "automerge=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Request Copilot code review
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR}/requested_reviewers" \
            -f 'reviewers[]=copilot-pull-request-reviewer[bot]' \
            && echo "Copilot review requested" \
            || echo "Could not request Copilot review; continuing"

      # Copilot code review solo comenta, nunca aprueba. La aprobacion formal la
      # emite github-actions[bot], que es una identidad distinta al autor del PR
      # (GitHub prohibe que un autor apruebe su propio PR).
      - name: Approve pull request
        if: steps.labels.outputs.automerge == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          approved=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/reviews" \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and .state == "APPROVED")] | length')
          if [ "$approved" -gt 0 ]; then
            echo "Already approved by github-actions[bot]"
          else
            gh pr review "$PR" --repo "$GITHUB_REPOSITORY" --approve \
              --body "Aprobado automaticamente. El merge queda condicionado a que CI pase."
          fi

      - name: Enable auto-merge
        if: steps.labels.outputs.automerge == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash --delete-branch \
            && echo "Auto-merge armed" \
            || echo "Could not enable auto-merge; branch protection may be missing on main"
